<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7ff61" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d7ff61" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="300" cy="170" r="140" fill="url(#netGlow)" />

  <!-- Constellation Orbit Lines -->
  <circle cx="300" cy="170" r="130" stroke="rgba(240, 238, 232, 0.08)" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="300" cy="170" r="85" stroke="rgba(215, 255, 97, 0.18)" stroke-width="1" />

  <!-- Connecting Lines -->
  <line x1="300" y1="170" x2="190" y2="100" stroke="rgba(215, 255, 97, 0.3)" stroke-width="1.2" />
  <line x1="300" y1="170" x2="410" y2="100" stroke="rgba(215, 255, 97, 0.3)" stroke-width="1.2" />
  <line x1="300" y1="170" x2="190" y2="240" stroke="rgba(215, 255, 97, 0.3)" stroke-width="1.2" />
  <line x1="300" y1="170" x2="410" y2="240" stroke="rgba(215, 255, 97, 0.3)" stroke-width="1.2" />

  <!-- Center Core -->
  <circle cx="300" cy="170" r="32" fill="#111515" stroke="#d7ff61" stroke-width="1.5" />
  <text x="300" y="176" fill="#d7ff61" font-family="'DM Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">CC</text>

  <!-- Bitcoin Node -->
  <g transform="translate(190, 100)">
    <circle cx="0" cy="0" r="24" fill="#181f1e" stroke="#f7931a" stroke-width="1.2" />
    <text x="0" y="6" fill="#f7931a" font-family="'DM Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">₿</text>
    <text x="0" y="38" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="9" text-anchor="middle">Bitcoin</text>
  </g>

  <!-- Ethereum Node -->
  <g transform="translate(410, 100)">
    <circle cx="0" cy="0" r="24" fill="#181f1e" stroke="#8c8cff" stroke-width="1.2" />
    <text x="0" y="6" fill="#8c8cff" font-family="'DM Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">◆</text>
    <text x="0" y="38" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="9" text-anchor="middle">Ethereum</text>
  </g>

  <!-- Solana Node -->
  <g transform="translate(190, 240)">
    <circle cx="0" cy="0" r="24" fill="#181f1e" stroke="#14f195" stroke-width="1.2" />
    <text x="0" y="6" fill="#14f195" font-family="'DM Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">◎</text>
    <text x="0" y="38" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="9" text-anchor="middle">Solana</text>
  </g>

  <!-- Arbitrum Node -->
  <g transform="translate(410, 240)">
    <circle cx="0" cy="0" r="24" fill="#181f1e" stroke="#28a0f0" stroke-width="1.2" />
    <text x="0" y="6" fill="#28a0f0" font-family="'DM Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">▲</text>
    <text x="0" y="38" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="9" text-anchor="middle">Arbitrum</text>
  </g>
</svg>
