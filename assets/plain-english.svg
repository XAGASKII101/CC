<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Card: Typical Confusing Web3 Prompt -->
  <g filter="url(#boxShadow)">
    <rect x="30" y="40" width="250" height="260" rx="14" fill="#111515" stroke="rgba(240, 238, 232, 0.12)" />
    <!-- Tag -->
    <rect x="46" y="56" width="90" height="18" rx="4" fill="#2b1818" />
    <text x="54" y="69" fill="#ff6b6b" font-family="'DM Mono', monospace" font-size="9" font-weight="600">THE COCKPIT NOISE</text>
    
    <text x="46" y="105" fill="#f0eee8" font-family="'Manrope', sans-serif" font-size="14" font-weight="600">Contract Interaction?</text>
    <text x="46" y="125" fill="#929994" font-family="'DM Mono', monospace" font-size="9">METHOD: 0xa9059cbb</text>

    <!-- Raw Data Box -->
    <rect x="46" y="140" width="218" height="85" rx="6" fill="#080a0a" stroke="rgba(240, 238, 232, 0.06)" />
    <text x="56" y="160" fill="#68716c" font-family="'DM Mono', monospace" font-size="8">0x000000000000000000000000</text>
    <text x="56" y="175" fill="#68716c" font-family="'DM Mono', monospace" font-size="8">881a783c326f1e8492d912b980</text>
    <text x="56" y="190" fill="#68716c" font-family="'DM Mono', monospace" font-size="8">00000000000000000000000000</text>
    <text x="56" y="205" fill="#68716c" font-family="'DM Mono', monospace" font-size="8">000000000de0b6b3a7640000</text>

    <text x="46" y="250" fill="#ff6b6b" font-family="'DM Mono', monospace" font-size="10">Est. Gas: Unknown (High)</text>
    <rect x="46" y="265" width="218" height="22" rx="4" fill="#1c2423" />
    <text x="155" y="280" fill="#929994" font-family="'Manrope', sans-serif" font-size="10" text-anchor="middle">Blind Sign</text>
  </g>

  <!-- Right Card: Cryptochains Plain English Solution -->
  <g filter="url(#boxShadow)">
    <rect x="320" y="30" width="250" height="280" rx="14" fill="#171c1c" stroke="#d7ff61" stroke-width="1.2" />
    <!-- Tag -->
    <rect x="336" y="46" width="94" height="18" rx="4" fill="rgba(215, 255, 97, 0.12)" />
    <text x="344" y="59" fill="#d7ff61" font-family="'DM Mono', monospace" font-size="9" font-weight="600">CRYPTOCHAINS CALM</text>

    <text x="336" y="95" fill="#f0eee8" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">You are sending</text>
    <text x="336" y="125" fill="#d7ff61" font-family="'Manrope', sans-serif" font-size="24" font-weight="800">1.00 ETH</text>
    <text x="445" y="123" fill="#929994" font-family="'DM Mono', monospace" font-size="12">($3,380.00)</text>

    <line x1="336" y1="145" x2="540" y2="145" stroke="rgba(240, 238, 232, 0.1)" />

    <text x="336" y="170" fill="#929994" font-family="'DM Mono', monospace" font-size="9">TO RECIPIENT</text>
    <text x="336" y="188" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="11">Alex · 0x881a...d912</text>

    <text x="336" y="215" fill="#929994" font-family="'DM Mono', monospace" font-size="9">NETWORK FEE</text>
    <text x="336" y="233" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="11">0.0004 ETH ($1.35) · 14 Gwei</text>

    <rect x="336" y="258" width="218" height="34" rx="8" fill="#d7ff61" />
    <text x="445" y="280" fill="#0b0d0d" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Approve with Confidence →</text>
  </g>
</svg>
