<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d7ff61" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d7ff61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0eee8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d7ff61" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f0eee8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="metalSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2423"/>
      <stop offset="40%" stop-color="#111515"/>
      <stop offset="100%" stop-color="#0b0d0d"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="180" fill="url(#cardGlow)" />

  <!-- Main Luxury Vault Card -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="60" width="400" height="250" rx="20" fill="url(#metalSheen)" stroke="url(#cardBorder)" stroke-width="1.5" />
  </g>

  <!-- Card Chip Emv -->
  <rect x="145" y="105" width="48" height="38" rx="6" fill="#1b2120" stroke="#d7ff61" stroke-width="1" stroke-opacity="0.5" />
  <path d="M 145 124 H 193 M 169 105 V 143 M 157 114 Q 169 124 157 134 M 181 114 Q 169 124 181 134" stroke="#d7ff61" stroke-width="0.8" stroke-opacity="0.4" fill="none" />

  <!-- Contactless NFC Wave -->
  <path d="M 210 115 A 8 8 0 0 1 210 133" stroke="#929994" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 216 110 A 15 15 0 0 1 216 138" stroke="#929994" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 222 105 A 22 22 0 0 1 222 143" stroke="#929994" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Monogram Brand -->
  <g transform="translate(420, 100)">
    <circle cx="20" cy="20" r="22" fill="#0b0d0d" stroke="#d7ff61" stroke-width="1.2" />
    <text x="20" y="26" fill="#d7ff61" font-family="'DM Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">CC</text>
  </g>

  <!-- Card Details / Numbers -->
  <text x="145" y="195" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="16" letter-spacing="3.5" font-weight="500">
    0x71C8 •••• •••• 5D51
  </text>

  <text x="145" y="240" fill="#929994" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.5">
    VAULT HOLDER
  </text>
  <text x="145" y="258" fill="#f0eee8" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
    SELF-CUSTODY CLIENT
  </text>

  <text x="360" y="240" fill="#929994" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.5">
    ENCRYPTION
  </text>
  <text x="360" y="258" fill="#d7ff61" font-family="'DM Mono', monospace" font-size="13" font-weight="600">
    AES-256-GCM
  </text>

  <!-- Holographic Security Pill -->
  <rect x="340" y="278" width="120" height="18" rx="9" fill="#18201e" stroke="#d7ff61" stroke-width="0.8" stroke-opacity="0.3" />
  <circle cx="350" cy="287" r="3" fill="#d7ff61" />
  <text x="360" y="291" fill="#f0eee8" font-family="'DM Mono', monospace" font-size="8" letter-spacing="1">ZERO TELEMETRY</text>
</svg>
